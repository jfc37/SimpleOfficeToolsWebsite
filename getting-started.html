<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>

    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="author" content="SemiColonWeb">

    <!-- Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

    <!-- Core Style -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Icons -->
    <link rel="stylesheet" href="css/font-icons.css">

    <!-- Plugins/Components CSS -->
    <link rel="stylesheet" href="css/swiper.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body, #wrapper { height: 100%; margin: 0; }

        /* Make slider fill the screen */
        #slider,
        #slider .slider-inner,
        .swiper,
        .swiper-parent,
        .swiper-wrapper,
        .swiper-slide { height: 100vh; }

        .swiper-slide { position: relative; }

        /* Full-bleed stage that centers video */
        .video-wrap {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; background:#000;
            width: 100%; height: 100%;
        }

        /* Never crop video */
        .video-wrap video {
            position: static !important;
            width: 100% !important; height: 100% !important;
            object-fit: contain !important;
            max-width: none !important; max-height: none !important;
        }

        /* Keep overlay and captions above video */
        .video-overlay { position:absolute; inset:0; z-index:2; }

        /* Prevent container widths from constraining captions */
        #slider .container { max-width: 100% !important; width: 100% !important; }
    </style>


    <!-- Document Title
    ============================================= -->
    <title>Simple Office Tools | How To Videos</title>

</head>

<body class="stretched">

<!-- Document Wrapper
============================================= -->
<div id="wrapper">

    <section id="slider" class="slider-element slider-parallax swiper_wrapper min-vh-60 min-vh-md-100 include-header" data-loop="true">
        <div class="slider-inner">

            <div class="swiper swiper-parent">
                <div class="swiper-wrapper">
                    <div class="swiper-slide dark">
                        <div class="container">
                            <div class="slider-caption slider-caption-center">
                                <h2 data-animate="fadeInUp">Drag and drop documents</h2>
                            </div>
                        </div>
                        <div class="video-wrap no-placeholder">
                            <video id="slide-video-1" preload="auto" loop autoplay muted playsinline>
                                <source src='videos/help-videos/01-drag-and-drop.mp4' type='video/mp4'>
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.55);"></div>
                        </div>
                    </div>
                    <div class="swiper-slide dark">
                        <div class="container">
                            <div class="slider-caption slider-caption-center">
                                <h2 data-animate="fadeInUp">Arrange by documents</h2>
                            </div>
                        </div>
                        <div class="video-wrap no-placeholder">
                            <video id="slide-video-2" preload="auto" loop autoplay muted playsinline>
                                <source src='videos/help-videos/02-organise-documents.mp4' type='video/mp4'>
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.55);"></div>
                        </div>
                    </div>
                    <div class="swiper-slide dark">
                        <div class="container">
                            <div class="slider-caption slider-caption-center">
                                <h2 data-animate="fadeInUp">Arrange by individual pages</h2>
                            </div>
                        </div>
                        <div class="video-wrap no-placeholder">
                            <video id="slide-video-3" preload="auto" loop autoplay muted playsinline>
                                <source src='videos/help-videos/03-organise-pages.mp4' type='video/mp4'>
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.55);"></div>
                        </div>
                    </div>
                    <div class="swiper-slide dark">
                        <div class="container">
                            <div class="slider-caption slider-caption-center">
                                <h2 data-animate="fadeInUp">Add watermarks</h2>
                            </div>
                        </div>
                        <div class="video-wrap no-placeholder">
                            <video id="slide-video-4" preload="auto" loop autoplay muted playsinline>
                                <source src='videos/help-videos/04-watermark.mp4' type='video/mp4'>
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.55);"></div>
                        </div>
                    </div>
                    <div class="swiper-slide dark">
                        <div class="container">
                            <div class="slider-caption slider-caption-center">
                                <h2 data-animate="fadeInUp">Add text, stamps, signatures, etc.</h2>
                            </div>
                        </div>
                        <div class="video-wrap no-placeholder">
                            <video id="slide-video-5" preload="auto" loop autoplay muted playsinline>
                                <source src='videos/help-videos/05-customise-page.mp4' type='video/mp4'>
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.55);"></div>
                        </div>
                    </div>
                    <div class="swiper-slide dark">
                        <div class="container">
                            <div class="slider-caption slider-caption-center">
                                <h2 data-animate="fadeInUp">Preview & export finished document</h2>
                            </div>
                        </div>
                        <div class="video-wrap no-placeholder">
                            <video id="slide-video-6" preload="auto" loop autoplay muted playsinline>
                                <source src='videos/help-videos/06-export.mp4' type='video/mp4'>
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.55);"></div>
                        </div>
                    </div>
                </div>
                <div class="slider-arrow-left"><i class="uil uil-angle-left-b"></i></div>
                <div class="slider-arrow-right"><i class="uil uil-angle-right-b"></i></div>
                <div class="slide-number"><div class="slide-number-current"></div><span>/</span><div class="slide-number-total"></div></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </section>

</div><!-- #wrapper end -->

<!-- JavaScripts
============================================= -->
<script src="js/plugins.min.js"></script>
<script src="js/functions.bundle.js"></script>

</body>
</html>
