<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>

    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="author" content="SemiColonWeb">

    <!-- Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

    <!-- Core Style -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Icons -->
    <link rel="stylesheet" href="css/font-icons.css">

    <!-- Plugins/Components CSS -->
    <link rel="stylesheet" href="css/swiper.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <style>
        /* Ensure videos fill the slide nicely */
        .video-wrap { position: relative; overflow: hidden; }
        .video-wrap video.slider-video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Make video scale to full slide width without cropping */
        #slider .video-wrap { height: auto !important; }
        #slider .video-wrap video.slider-video{
            position: static !important;
            width: 100% !important;
            height: auto !important;
            object-fit: contain !important; /* no left/right crop */
            display: block;
        }

    </style>

    <!-- Document Title
    ============================================= -->
    <title>Canvas Slider with Pagination | Canvas</title>

</head>

<body class="stretched">

<!-- Document Wrapper
============================================= -->
<div id="wrapper">

    <section id="slider" class="slider-element slider-parallax swiper_wrapper min-vh-60 min-vh-md-100 include-header" data-loop="false">
        <div class="slider-inner">
            <div class="swiper swiper-parent">
                <div class="swiper-wrapper">

                    <!-- Drag and drop documents -->
                    <div class="swiper-slide dark">
                        <div class="video-wrap no-placeholder">
                            <video class="slider-video" preload="metadata" controls muted playsinline>
                                <source src="videos/help-videos/01-drag-and-drop.mp4" type="video/mp4">
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.25);"></div>
                        </div>
                        <div class="container">
                            <div class="slider-caption slider-caption-center"><h2>Drag and drop documents</h2></div>
                        </div>
                    </div>

                    <!-- Organise documents -->
                    <div class="swiper-slide dark">
                        <div class="video-wrap no-placeholder">
                            <video class="slider-video" preload="metadata" controls muted playsinline>
                                <source src="videos/help-videos/02-organise-documents.mp4" type="video/mp4">
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.25);"></div>
                        </div>
                        <div class="container">
                            <div class="slider-caption slider-caption-center"><h2>Arrange by documents</h2></div>
                        </div>
                    </div>

                    <!-- Organise pages -->
                    <div class="swiper-slide dark">
                        <div class="video-wrap no-placeholder">
                            <video class="slider-video" preload="metadata" controls muted playsinline>
                                <source src="videos/help-videos/03-organise-pages.mp4" type="video/mp4">
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.25);"></div>
                        </div>
                        <div class="container">
                            <div class="slider-caption slider-caption-center"><h2>Arrange by individual pages</h2></div>
                        </div>
                    </div>

                    <!-- Add watermark -->
                    <div class="swiper-slide dark">
                        <div class="video-wrap no-placeholder">
                            <video class="slider-video" preload="metadata" controls muted playsinline>
                                <source src="videos/help-videos/04-watermark.mp4" type="video/mp4">
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.25);"></div>
                        </div>
                        <div class="container">
                            <div class="slider-caption slider-caption-center"><h2>Add watermarks</h2></div>
                        </div>
                    </div>

                    <!-- Customise page -->
                    <div class="swiper-slide dark">
                        <div class="video-wrap no-placeholder">
                            <video class="slider-video" preload="metadata" controls muted playsinline>
                                <source src="videos/help-videos/05-customise-page.mp4" type="video/mp4">
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.25);"></div>
                        </div>
                        <div class="container">
                            <div class="slider-caption slider-caption-center"><h2>Add text, stamps, signatures, etc.</h2></div>
                        </div>
                    </div>

                    <!-- Export -->
                    <div class="swiper-slide dark">
                        <div class="video-wrap no-placeholder">
                            <video class="slider-video" preload="metadata" controls muted playsinline>
                                <source src="videos/help-videos/06-export.mp4" type="video/mp4">
                            </video>
                            <div class="video-overlay" style="background-color: rgba(0,0,0,0.25);"></div>
                        </div>
                        <div class="container">
                            <div class="slider-caption slider-caption-center"><h2>Preview & export finished document</h2></div>
                        </div>
                    </div>

                </div>

                <div class="slider-arrow-left"><i class="uil uil-angle-left-b"></i></div>
                <div class="slider-arrow-right"><i class="uil uil-angle-right-b"></i></div>
                <div class="slide-number"><div class="slide-number-current"></div><span>/</span><div class="slide-number-total"></div></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </section>

</div><!-- #wrapper end -->

<!-- JavaScripts
============================================= -->
<script src="js/plugins.min.js"></script>
<script src="js/functions.bundle.js"></script>

<script>
    // Pause non-active videos. Play the active one when slide changes.
    document.addEventListener('DOMContentLoaded', function () {
        var root = document.querySelector('.swiper-parent');
        if (!root) return;
        var swiper = root.swiper;
        var vids = Array.from(root.querySelectorAll('.slider-video'));

        function syncVideos() {
            vids.forEach(function (v, i) {
                if (i === swiper.realIndex) {
                    v.play().catch(function(){});
                } else {
                    v.pause();
                }
            });
        }

        if (swiper) {
            syncVideos();
            swiper.on('slideChange', syncVideos);
        }
    });
</script>

</body>
</html>
